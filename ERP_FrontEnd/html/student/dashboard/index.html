<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Your academic day, records and campus services in one place.">
    <title>Student overview | AstraCampus</title>
    <link rel="stylesheet" href="../../../css/tokens.css">
    <link rel="stylesheet" href="../../../css/components.css">

  <body class="portal-body" data-role="student" data-module="dashboard" data-title="Student overview" data-description="Your academic day, records and campus services in one place.">
    <a class="skip-link" href="#main-content">
      Skip to content
    </a>
    <div id="app-root">
      <p class="loading-state">
        Opening preview…
      </p>
    </div>
    <template id="module-content-template">
      <section class="card module-card span-8 student-dashboard">
        <div class="card-head">
          <div>
            <h2>
              <span data-dashboard-greeting>Welcome back</span>, Demo Student
            </h2>
            <p>
              Your sample campus feed is ready.
            </p>
          </div>
          <span class="status info">
            Term 3 · sample
          </span>
        </div>
        <div class="welcome-grid">
          <div>
            <span class="metric-label">
              Attendance snapshot
            </span>
            <strong class="welcome-number">
              86
              <span>
                %
              </span>
            </strong>
            <small>
              Across sample subjects
            </small>
          </div>
          <div class="welcome-art" aria-hidden="true">
            <span class="orbit-dot">
            </span>
            <span class="orbit-core">
              86%
            </span>
          </div>
        </div>
        <div class="quick-grid">
          <a class="quick-link" href="../timetable/index.html">
            <span>
              ◷
            </span>
            <b>
              View timetable
            </b>
            <small>
              See today's classes
            </small>
          </a>
          <a class="quick-link" href="../regular-exam/index.html">
            <span>
              ▣
            </span>
            <b>
              Exam booking
            </b>
            <small>
              Review included subjects
            </small>
          </a>
          <a class="quick-link" href="../requests/index.html">
            <span>
              ◎
            </span>
            <b>
              My requests
            </b>
            <small>
              Track updates
            </small>
          </a>
        </div>
      </section>
      <section class="card module-card span-4 dashboard-side">
        <div class="card-head">
          <div>
            <h2>
              Next on your day
            </h2>
            <p>
              From your sample timetable
            </p>
          </div>
          <span class="status success">
            Today
          </span>
        </div>
        <div class="next-class">
          <span class="time-rail">
            09:00
          </span>
          <div>
            <b>
              Object Oriented Programming
            </b>
            <small>
              Room 204 · Faculty member A
            </small>
          </div>
        </div>
        <div class="next-class">
          <span class="time-rail">
            11:30
          </span>
          <div>
            <b>
              Database Systems
            </b>
            <small>
              Lab 2 · Faculty member B
            </small>
          </div>
        </div>
        <a class="text-link" href="../timetable/index.html">
          Open full timetable →
        </a>
      </section>
      <section class="card module-card span-12">
        <div class="card-head">
          <div>
            <h2>
              Campus services
            </h2>
            <p>
              Jump straight to the page you need.
            </p>
          </div>
          <span class="count-label">
            12 STUDENT MODULES
          </span>
        </div>
        <div class="service-grid">
          <a href="../attendance/index.html">
            <span>
              ✓
            </span>
            <b>
              Attendance
            </b>
          </a>
          <a href="../notices/index.html">
            <span>
              ▤
            </span>
            <b>
              Notices
            </b>
          </a>
          <a href="../backlog-exam/index.html">
            <span>
              ↻
            </span>
            <b>
              Backlog exam
            </b>
          </a>
          <a href="../materials/index.html">
            <span>
              ▧
            </span>
            <b>
              Study materials
            </b>
          </a>
          <a href="../academic-details/index.html">
            <span>
              ◈
            </span>
            <b>
              Academic details
            </b>
          </a>
          <a href="../faculty/index.html">
            <span>
              ♙
            </span>
            <b>
              Faculty
            </b>
          </a>
          <a href="../leave/index.html">
            <span>
              ✎
            </span>
            <b>
              Leave
            </b>
          </a>
          <a href="../fees/index.html">
            <span>
              ¤
            </span>
            <b>
              Fees
            </b>
          </a>
        </div>
      </section>
      <section class="card module-card span-12">
        <div class="card-head">
          <div>
            <h2>
              Latest notice
            </h2>
            <p>
              Sample audience and issuer details.
            </p>
          </div>
          <a class="text-link" href="../notices/index.html">
            All notices →
          </a>
        </div>
        <article class="notice-card">
          <div class="notice-meta">
            <span class="status warning">
              Examination
            </span>
            <span>
              Sample date · Exam Cell
            </span>
          </div>
          <h3>
            Regular exam registration window
          </h3>
          <p>
            Review the subjects linked to your active enrollment before continuing.
          </p>
        </article>
      </section>
    </template>
    <noscript>
      <p class="noscript-message">
        Turn on JavaScript to use this frontend preview.
      </p>
    </noscript>
  </body>
</html>
