<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Daily schedule and work assigned to your account.">
    <title>Faculty overview | AstraCampus</title>
    <link rel="stylesheet" href="../../../css/tokens.css">
    <link rel="stylesheet" href="../../../css/components.css">
    <link rel="stylesheet" href="../../../css/portal.css">
    <link rel="stylesheet" href="../../../css/responsive.css">
    <link rel="stylesheet" href="../../../css/modules/teacher/dashboard/module.css">
    <script defer src="../../../javascript/modules/shared/portal-shell.js"></script>
    <script defer src="../../../javascript/common.js"></script>
  </head>
  <body class="portal-body" data-role="teacher" data-module="dashboard" data-title="Faculty overview" data-description="Daily schedule and work assigned to your account.">
    <a class="skip-link" href="#main-content">
      Skip to content
    </a>
    <div id="app-root">
      <p class="loading-state">
        Opening preview…
      </p>
    </div>
    <template id="module-content-template">
      <section class="card module-card span-8">
        <div class="card-head">
          <div>
            <h2>
              <span data-dashboard-greeting>Welcome back</span>, Demo Teacher
            </h2>
            <p>
              Your assigned classes and sample work at a glance.
            </p>
          </div>
          <span class="status success">
            Faculty view
          </span>
        </div>
        <div class="metric-grid">
          <article class="metric-card">
            <small>
              Classes today
            </small>
            <strong>
              2
            </strong>
            <span>
              Sample schedule
            </span>
          </article>
          <article class="metric-card">
            <small>
              Assigned subjects
            </small>
            <strong>
              3
            </strong>
            <span>
              From account
            </span>
          </article>
          <article class="metric-card">
            <small>
              Pending leave
            </small>
            <strong>
              1
            </strong>
            <span>
              Only if Class Teacher
            </span>
          </article>
          <article class="metric-card">
            <small>
              Requests
            </small>
            <strong>
              3
            </strong>
            <span>
              Assigned to you
            </span>
          </article>
        </div>
        <div class="quick-grid">
          <a class="quick-link" href="../attendance/index.html">
            <span>
              ✓
            </span>
            <b>
              Take attendance
            </b>
            <small>
              Assigned session · 24-hour window
            </small>
          </a>
          <a class="quick-link" href="../applications/index.html">
            <span>
              ◎
            </span>
            <b>
              Review requests
            </b>
            <small>
              Only assigned items
            </small>
          </a>
          <a class="quick-link" href="../marks/index.html">
            <span>
              ▤
            </span>
            <b>
              Marks status
            </b>
            <small>
              Your subject submissions
            </small>
          </a>
        </div>
      </section>
      <section class="card module-card span-4">
        <div class="card-head">
          <div>
            <h2>
              Next session
            </h2>
            <p>
              Sample timetable
            </p>
          </div>
          <span class="status info">
            Today
          </span>
        </div>
        <div class="next-class">
          <span class="time-rail">
            09:00
          </span>
          <div>
            <b>
              Object Oriented Programming
            </b>
            <small>
              Section A · Room 204
            </small>
          </div>
        </div>
        <div class="next-class">
          <span class="time-rail">
            11:30
          </span>
          <div>
            <b>
              Database Systems
            </b>
            <small>
              Section B · Lab 2
            </small>
          </div>
        </div>
        <a class="text-link" href="../timetable/index.html">
          View my timetable →
        </a>
      </section>
      <section class="card module-card span-12">
        <div class="card-head">
          <div>
            <h2>
              Recent academic notice
            </h2>
            <p>
              Sample notice sent to assigned classes.
            </p>
          </div>
          <a class="text-link" href="../notices/index.html">
            Open notices →
          </a>
        </div>
        <article class="notice-card">
          <div class="notice-meta">
            <span class="status warning">
              Academic
            </span>
            <span>
              Sample date · Section A
            </span>
          </div>
          <h3>
            Marks submission reminder
          </h3>
          <p>
            Review assigned submissions before forwarding them to the Exam Cell.
          </p>
        </article>
      </section>
    </template>
    <noscript>
      <p>
        Turn on JavaScript to use this preview.
      </p>
    </noscript>
  </body>
</html>
